name: Build and Release Blender Extension

on:
  push:
    tags:
      - 'v*' # Срабатывает при отправке тега, например v1.0.0

permissions:
  contents: write # Разрешение на загрузку файлов в GitHub Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Pack Extension into ZIP
        run: |
          ZIP_NAME="wheel_of_fortune-v${{ env.VERSION }}.zip"
          
          # Упаковываем файлы прямо в корень архива (без вложенных папок)
          zip -r "$ZIP_NAME" __init__.py operators.py properties.py translations.py ui.py utils.py blender_manifest.toml -x "*.pyc" "*/__pycache__/*" "*.DS_Store"
          
          echo "ZIP_PATH=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          name: Release v${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}