name: Package and Release Blender Addon

on:
  push:
    tags:
      - 'v*' # Срабатывает при отправке тегов вида v1.0.0, v0.1.0 и т.д.

permissions:
  contents: write # Права на создание релизов на GitHub

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Извлекаем чистую версию из тега (например, "v1.0.0" -> "1.0.0")
      - name: Extract version tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # 2. Собираем структуру аддона и упаковываем в ZIP
      - name: Create Addon ZIP Archive
        run: |
          ADDON_DIR="wheel_of_fortune"
          ZIP_NAME="${ADDON_DIR}-v${{ env.VERSION }}.zip"
          
          # Создаем временную директорию для правильной структуры аддона
          mkdir -p "$ADDON_DIR"
          
          # Копируем Python-файлы аддона и манифест (если используется в Blender 4.2+)
          cp __init__.py operators.py properties.py translations.py ui.py utils.py "$ADDON_DIR/" 2>/dev/null || true
          [ -f blender_manifest.toml ] && cp blender_manifest.toml "$ADDON_DIR/" || true
          
          # Упаковываем созданную папку в ZIP-архив, исключая __pycache__
          zip -r "$ZIP_NAME" "$ADDON_DIR" -x "*.pyc" "*/__pycache__/*" "*.DS_Store"
          
          echo "ZIP_PATH=$ZIP_NAME" >> $GITHUB_ENV

      # 3. Публикуем Release в GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          name: Release v${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}